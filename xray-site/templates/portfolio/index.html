<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{NAME}} — نمونه‌کارها</title>
<style>
  :root { --bg:#0b0b0f; --card:#15151c; --text:#f2f2f5; --muted:#9b9bab; --line:#26262f; --a:#fb7185; }
  @media (prefers-color-scheme: light) { :root { --bg:#fafafa; --card:#fff; --text:#16161d; --muted:#6b6b7a; --line:#e8e8ee; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family: Vazirmatn, IRANSans, Tahoma, "Segoe UI", sans-serif; line-height:1.9; }
  .wrap { max-width:1080px; margin:0 auto; padding:0 16px; }
  a { color:inherit; text-decoration:none; }
  .top { display:flex; justify-content:space-between; align-items:center; padding:22px 0; gap:10px; flex-wrap:wrap; }
  .top nav { display:flex; gap:20px; color:var(--muted); font-size:14px; }
  .hero { padding:60px 0 40px; display:grid; grid-template-columns:auto 1fr; gap:28px; align-items:center; }
  .avatar { width:120px; height:120px; border-radius:50%; background:conic-gradient(from 120deg, #fb7185, #f59e0b, #8b5cf6, #fb7185); padding:4px; }
  .avatar div { width:100%; height:100%; border-radius:50%; background:var(--bg); display:grid; place-items:center; font-size:44px; }
  .hero h1 { margin:0; font-size:clamp(28px, 5vw, 46px); }
  .hero p { margin:6px 0 16px; color:var(--muted); font-size:17px; }
  .tags { display:flex; gap:8px; flex-wrap:wrap; }
  .tags span { border:1px solid var(--line); border-radius:999px; padding:3px 14px; font-size:13px; color:var(--muted); }
  .filters { display:flex; gap:8px; margin:20px 0 16px; flex-wrap:wrap; }
  .filters button { background:transparent; border:1px solid var(--line); color:var(--muted); border-radius:999px; padding:5px 16px; font:inherit; font-size:14px; cursor:pointer; }
  .filters button.on { background:var(--a); border-color:var(--a); color:#fff; }
  .gallery { columns:3 260px; column-gap:14px; }
  .work { break-inside:avoid; margin-bottom:14px; border-radius:18px; overflow:hidden; position:relative; cursor:pointer; }
  .work .img { width:100%; display:block; transition:transform .5s; }
  .work:hover .img { transform:scale(1.04); }
  .work .cap { position:absolute; inset:auto 0 0 0; padding:40px 16px 14px; background:linear-gradient(transparent, rgba(0,0,0,.75)); color:#fff; opacity:0; transition:.3s; }
  .work:hover .cap { opacity:1; }
  .cap b { display:block; }
  .cap span { font-size:13px; opacity:.8; }
  section h2 { font-size:22px; margin:60px 0 18px; }
  .skills { display:grid; grid-template-columns:repeat(auto-fit, minmax(220px, 1fr)); gap:14px; }
  .skill { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px; }
  .meter { height:6px; background:var(--line); border-radius:999px; overflow:hidden; margin-top:8px; }
  .meter i { display:block; height:100%; background:linear-gradient(90deg, #fb7185, #f59e0b); border-radius:999px; }
  .cta { margin:60px 0 0; border-radius:24px; padding:36px; text-align:center; background:linear-gradient(135deg, #be123c, #7c3aed); color:#fff; }
  .cta h3 { margin:0 0 6px; font-size:24px; }
  .cta a { display:inline-block; margin-top:14px; background:#fff; color:#111; padding:10px 24px; border-radius:12px; font-weight:700; }
  footer { padding:30px 0; color:var(--muted); font-size:13px; text-align:center; }
  @media (max-width:560px) { .hero { grid-template-columns:1fr; text-align:center; } .avatar { margin:0 auto; } .tags { justify-content:center; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><b>{{NAME}}</b><nav><a href="#works">کارها</a><a href="#skills">مهارت‌ها</a><a href="#contact">همکاری</a></nav></div>
  <div class="hero">
    <div class="avatar"><div>✦</div></div>
    <div>
      <h1>{{NAME}}</h1>
      <p>{{TAGLINE}}</p>
      <div class="tags"><span>طراحی UI/UX</span><span>برندینگ</span><span>عکاسی</span><span>موشن</span></div>
    </div>
  </div>

  <div class="filters" id="works">
    <button class="on" data-f="all">همه</button><button data-f="ui">رابط کاربری</button><button data-f="brand">برندینگ</button><button data-f="photo">عکاسی</button>
  </div>
  <div class="gallery" id="gallery"></div>

  <section id="skills">
    <h2>مهارت‌ها</h2>
    <div class="skills">
      <div class="skill">طراحی رابط کاربری<div class="meter"><i style="width:95%"></i></div></div>
      <div class="skill">هویت بصری و برندینگ<div class="meter"><i style="width:85%"></i></div></div>
      <div class="skill">عکاسی محصول<div class="meter"><i style="width:80%"></i></div></div>
      <div class="skill">موشن گرافیک<div class="meter"><i style="width:70%"></i></div></div>
    </div>
  </section>

  <div class="cta" id="contact">
    <h3>پروژه‌ای در ذهن دارید؟</h3>
    <div>خوشحال می‌شوم درباره‌اش بشنوم.</div>
    <a href="#contact">{{EMAIL}}</a>
  </div>
  <footer>© {{YEAR}} {{NAME}}</footer>
</div>
<script>
  var works = [
    ["اپلیکیشن بانکی", "ui", 1.25, "#4f46e5", "#06b6d4"], ["هویت بصری کافه", "brand", .8, "#f59e0b", "#ef4444"],
    ["کوه‌های البرز", "photo", 1.4, "#0f766e", "#1e3a8a"], ["داشبورد تحلیلی", "ui", .75, "#7c3aed", "#db2777"],
    ["لوگوی استارتاپ", "brand", 1, "#16a34a", "#0891b2"], ["پرتره در نور طبیعی", "photo", 1.3, "#9a3412", "#f59e0b"],
    ["فروشگاه آنلاین", "ui", 1.1, "#e11d48", "#9333ea"], ["بسته‌بندی محصول", "brand", .9, "#2563eb", "#22c55e"],
    ["شب‌های شهر", "photo", .85, "#111827", "#6d28d9"]
  ];
  var g = document.getElementById("gallery");
  function show(f) {
    g.innerHTML = "";
    works.forEach(function (w) {
      if (f !== "all" && w[1] !== f) return;
      var d = document.createElement("div"); d.className = "work";
      var img = document.createElement("div"); img.className = "img";
      img.style.aspectRatio = "1 / " + w[2];
      img.style.background = "radial-gradient(circle at 30% 30%, rgba(255,255,255,.35), transparent 40%), linear-gradient(135deg, " + w[3] + ", " + w[4] + ")";
      var cap = document.createElement("div"); cap.className = "cap";
      cap.innerHTML = "<b></b><span></span>"; cap.querySelector("b").textContent = w[0];
      cap.querySelector("span").textContent = { ui: "رابط کاربری", brand: "برندینگ", photo: "عکاسی" }[w[1]];
      d.appendChild(img); d.appendChild(cap); g.appendChild(d);
    });
  }
  document.querySelectorAll(".filters button").forEach(function (b) {
    b.onclick = function () { document.querySelectorAll(".filters button").forEach(function (x) { x.classList.remove("on"); }); b.classList.add("on"); show(b.dataset.f); };
  });
  show("all");
</script>
</body>
</html>
